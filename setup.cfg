[flake8]
max-line-length = 100
ignore = E501,F401,F841,W503,E203,W291,W292,W293,E128,E129,E226,W504,F811,F541
exclude = 
    .git,
    __pycache__,
    venv,
    .venv,
    build,
    dist,
    *.egg-info

[pycodestyle]
max-line-length = 100
ignore = E501,W503,E203

[pydocstyle]
ignore = D100,D101,D102,D103,D104,D105,D106,D107 